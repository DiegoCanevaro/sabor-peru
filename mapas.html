<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabor Perú - Mapas de las cocinas</title>
<link rel="stylesheet" href="css/fonts.css">
<style>
  :root { --bg: #2a1a10; --card: #fbf4e4; --ink: #5a2a18; --accent: #d9402a; --floor: #f3e6c8; --line: #c9b48a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--card); font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 22px 24px 8px; }
  h1 { font-family: Kitchen, sans-serif; font-weight: normal; font-size: 40px; margin: 0; color: #f4c53b; }
  header p { margin: 6px 0 0; max-width: 860px; color: #e9d9b8; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 18px; padding: 16px 24px 40px; }
  .card { background: var(--card); color: var(--ink); border-radius: 18px; padding: 14px; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 { font-family: Kitchen, sans-serif; font-weight: normal; font-size: 24px; margin: 0; }
  .shape { font-weight: 700; color: var(--accent); white-space: nowrap; }
  canvas { width: 100%; height: auto; display: block; margin: 10px 0; border-radius: 10px; }
  .ctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ctrl input, .ctrl select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .ctrl input { width: 90px; }
  button, a.btn { font: inherit; font-weight: 700; padding: 6px 12px; border-radius: 9px; border: 0; background: #f4c53b; color: var(--ink); cursor: pointer; text-decoration: none; }
  button.alt { background: #e9dcc0; }
  code { display: block; margin-top: 8px; background: #efe4c9; padding: 6px 9px; border-radius: 8px; font-size: 13px; user-select: all; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 24px; color: #e9d9b8; font-size: 13px; }
  .legend span b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .warn { padding: 30px 24px; color: #ffd28a; }
</style>
</head>
<body>
<header>
  <h1>Mapas de las cocinas</h1>
  <p>Cada nivel genera su cocina con una semilla. Cambia la semilla o la forma para ver otras distribuciones. Cuando te guste una, copia la línea de abajo en <b>js/levels/</b> dentro del <b>LEVEL</b> de ese nivel, o ábrela en 3D para probarla.</p>
</header>
<div class="legend" id="legend"></div>
<div id="grid"></div>
<script src="js/config.js"></script>
<script src="js/mapgen.js"></script>
<script>
const LEVEL_FILES = ['1-1', '1-2', '1-3', '1-4', '1-5', '2-1', '2-2', '2-3'];
const COL = { crate: '#b9803f', pot: '#5d6a74', stew: '#c06a2a', pan: '#3a3f4a', wok: '#26282c', board: '#dba867', bowl: '#9bc3d6',
  blender: '#d9402a', fryer: '#e8b33a', counter: '#2f6fb3', trash: '#3f5a3c', table: '#e7d3a8', deco: '#a89a80' };
const ICO = { pot: '🍲', stew: '🍛', pan: '🍳', wok: '🥘', board: '🔪', bowl: '🥣', blender: '🌀', fryer: '🍟', counter: '➜', trash: '🗑️' };
const NAMES = { crate: 'Caja', pot: 'Olla', stew: 'Olla del guiso', pan: 'Sartén', wok: 'Wok', board: 'Tabla', bowl: 'Bowl', blender: 'Licuadora', fryer: 'Freidora', counter: 'Salida', trash: 'Basura', table: 'Mesa', deco: 'Encimera tapada' };
document.getElementById('legend').innerHTML = Object.keys(NAMES).map(k => `<span><b style="background:${COL[k]}"></b>${ICO[k] || ''} ${NAMES[k]}</span>`).join('') + '<span>🍽️ platos al empezar · 🧑‍🍳 inicio</span>';

function draw(cv, m) {
  const C = 40, x = cv.getContext('2d'); cv.width = 13 * C; cv.height = 8 * C;
  x.fillStyle = '#7a6a55'; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = '#f3e6c8'; x.fillRect(C, C, 11 * C, 6 * C);
  x.strokeStyle = 'rgba(150,120,80,.25)'; for (let c = 1; c < 12; c++) for (let r = 1; r < 7; r++) x.strokeRect(c * C, r * C, C, C);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const s of m.stations) {
    const h = (s.tall || 1) * C;
    x.fillStyle = COL[s.kind] || '#999'; x.beginPath(); x.roundRect(s.c * C + 2, s.r * C + 2, C - 4, h - 4, 7); x.fill();
    // borde hacia donde se usa
    const fx = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[s.face];
    x.fillStyle = 'rgba(0,0,0,.28)';
    if (fx[1]) x.fillRect(s.c * C + 6, s.r * C + (fx[1] > 0 ? h - 7 : 3), C - 12, 4); else x.fillRect(s.c * C + (fx[0] > 0 ? C - 7 : 3), s.r * C + 6, 4, h - 12);
    x.font = '20px sans-serif';
    const t = s.kind === 'crate' ? (CRATE_INFO[s.item] || ['?'])[0] : s.plates ? '' : ICO[s.kind] || '';
    if (t) x.fillText(t, s.c * C + C / 2, s.r * C + h / 2 + 1);
  }
  // los platos empiezan en las mesas de abajo más cercanas a la salida
  const out = m.stations.find(s => s.kind === 'counter');
  m.stations.filter(s => s.plates).sort((a, b) => Math.hypot(a.c - out.c, a.r - out.r) - Math.hypot(b.c - out.c, b.r - out.r)).slice(0, 2)
    .forEach(s => x.fillText('🍽️', s.c * C + C / 2, s.r * C + C / 2 + 1));
  x.font = '22px sans-serif'; x.fillText('🧑‍🍳', m.spawn[0] * C + C / 2, m.spawn[1] * C + C / 2 + 1);
}

async function loadLevel(id) {
  const src = await (await fetch('js/levels/level-' + id + '.js')).text();
  return new Function(src + '\nreturn LEVEL;')();
}
function card(level) {
  const el = document.createElement('div'); el.className = 'card';
  const def = level.map || {};
  el.innerHTML = `<div class="top"><h2>${level.title.replace(/^Nivel /, '')}</h2><span class="shape"></span></div>
    <canvas></canvas>
    <div class="ctrl">
      <label>Semilla <input class="seed" value="${def.seed != null ? def.seed : level.id}"></label>
      <select class="shp"><option value="">Forma: automática</option>${MAPGEN.SHAPES.concat(['clasica']).map(s => `<option value="${s}" ${def.shape === s ? 'selected' : ''}>${MAPGEN.SHAPE_NAMES[s]}</option>`).join('')}</select>
      <button class="rnd alt">🎲 Otra</button>
      <a class="btn go" target="_blank">Probar en 3D</a>
    </div>
    <code></code>`;
  const $ = s => el.querySelector(s);
  const page = level.id.startsWith('K') ? '' : 'nivel' + level.id + '-3d.html';
  const render = () => {
    const raw = $('.seed').value.trim(), seed = /^\d+$/.test(raw) ? +raw : raw, shape = $('.shp').value;
    const m = MAPGEN.generate(level, shape === 'clasica' ? { shape } : { seed, shape: shape || undefined });
    draw($('canvas'), m);
    $('.shape').textContent = m.name;
    const parts = []; if (shape !== 'clasica') parts.push('seed: ' + JSON.stringify(seed)); if (shape) parts.push("shape: '" + shape + "'");
    $('code').textContent = 'map: { ' + parts.join(', ') + ' },';
    $('.go').href = page + '?mapa=' + encodeURIComponent(shape === 'clasica' ? 'clasica' : raw) + (shape && shape !== 'clasica' ? '&forma=' + shape : '');
  };
  $('.seed').addEventListener('input', render);
  $('.shp').addEventListener('change', render);
  $('.rnd').addEventListener('click', () => { $('.seed').value = Math.floor(Math.random() * 9999); render(); });
  render();
  return el;
}
(async () => {
  try {
    const levels = await Promise.all(LEVEL_FILES.map(loadLevel));
    levels.forEach(l => document.getElementById('grid').appendChild(card(l)));
  } catch (e) {
    document.getElementById('grid').outerHTML = '<p class="warn">No se pudieron leer los niveles. Abre esta página desde Netlify o con un servidor local (por ejemplo <b>python -m http.server</b> en la carpeta del juego), no con doble clic.</p>';
  }
})();
</script>
</body>
</html>
