<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sabor Perú - Nivel 2-3: Tallarín Saltado (3D)</title>
  <link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/style3d.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>

<body>
  <div id="gameWrap">
    <div id="hud">
      <span id="scoreDisplay">⭐ 0</span>
      <span id="customerDisplay"></span>
      <button id="botBtn" class="small">🤖 Ayudante: OFF (B)</button>
    </div>
    <div id="tickets"></div>
    <canvas id="c" width="900" height="560"></canvas>

    <div id="startOverlay" class="overlay show">
      <h1>Nivel 2-3: Tallarín Saltado</h1>
      <p>Tallarines cocidos, carne, cebolla y tomate salteados en el wok con sillao.</p>
      <div class="btnRow"><a class="gamebtn alt" href="index.html#niveles">← Niveles</a><button id="startBtn"
          class="gamebtn">¡Empezar!</button></div>
    </div>

    <div id="overlay" class="overlay">
      <h1 id="overlayTitle"></h1>
      <p id="overlaySubtitle"></p>
      <button id="recipeBtn" class="gamebtn alt">📖 Ver receta real</button>
      <div id="recipeCard" style="display:none"></div>
      <div class="btnRow"><a class="gamebtn alt" href="index.html#niveles">Elegir nivel</a><button id="restartBtn"
          class="gamebtn">Jugar de nuevo</button></div>
    </div>
  </div>

  <div id="touchControls">
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <button id="actBtn">ACCIÓN</button>
  </div>
  <div id="hint">WASD/flechas: mover · Espacio/E: interactuar (mantén presionado en la tabla) · P: pausa · B:
    ayudante · Una sola cosa en las manos a la vez</div>

  <script src="js/menu.js"></script>
  <script src="js/config.js"></script>
  <script src="js/recipes-data.js"></script>
  <script src="js/dishes.js"></script>
  <script src="js/levels/level-2-3.js"></script>
  <script src="js/ing-images.js"></script>
  <script src="js/tool-images.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/dish-images.js"></script>
  <script src="js/dish-icons.js"></script>
  <script src="js/howto.js"></script>
  <script src="js/plate.js"></script>
  <script src="js/state.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/movement.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/interact.js"></script>
  <script src="js/helper.js"></script>
  <script src="js/update.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/GLTFLoader.js"></script>
  <script src="js/3d/assets-kaykit.js"></script>
  <script src="js/3d/labels3d.js"></script>
  <script src="js/3d/render3d.js"></script>
  <script src="js/3d/street3d.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/input.js"></script>
  <script src="js/pause.js"></script>
  <script src="js/fullscreen.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
